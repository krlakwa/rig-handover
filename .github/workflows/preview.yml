# Plan morning-digest § 3–4. Publishes the digest preview to GitHub Pages. The page is built here,
# never committed (ADR 0003): the marker comes from the repo variable LANE_MARKER. Delete that
# variable and run this again to upload the same page over the same link with "no marker set".
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run preview
        env:
          LANE_ID: lane-07
          LANE_MARKER: ${{ vars.LANE_MARKER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: var/preview
      - id: deploy
        uses: actions/deploy-pages@v4
